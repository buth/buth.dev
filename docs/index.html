    <style>
        /*
         * Self-hosted so the page has no third-party origins on its critical
         * path. This is the Google Fonts "latin" subset of IBM Plex Sans
         * Regular, the only face the page uses. No unicode-range: the file is
         * preloaded unconditionally, so range-gating the download would save
         * nothing, and a glyph outside the subset falls back through the stack
         * below either way.
         */
        @font-face {
            font-family: "IBM Plex Sans";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("/fonts/ibm-plex-sans-latin-400.woff2") format("woff2");
        }

        :root {
            /* Channels only, so the alpha ladder below can vary one value. */
            --fg: 210 191 172;
            --bg: rgb(47, 47, 47);
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            background-color: var(--bg);
            color: rgb(var(--fg));
            /*
             * Fallbacks ordered by metric similarity to Plex, not platform
             * preference: Helvetica Neue and Arial match its advance widths
             * within 1%, so the paragraph keeps its line count through the
             * swap. system-ui (SF on Apple) runs ~7% narrower and can drop
             * a line on a phone, re-centering the whole block.
             */
            font-family: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
            font-size: 14pt;
            line-height: 1.6;
        }

        /*
         * Auto margins center the block, but unlike `align-items: center` they
         * resolve to zero when free space is negative (Flexbox 8.1). On a short
         * viewport the content therefore sits at the start edge and scrolls,
         * instead of overflowing equally in both directions with the top half
         * unreachable.
         */
        main {
            margin: auto;
            width: 100%;
            max-width: 410px;
            padding-block: 24px;
        }

        header {
            color: rgb(var(--fg) / .5);
        }

        header,
        nav {
            padding: 0 10px;
        }

        h1 {
            font-size: 28pt;
            color: rgb(var(--fg) / .3);
            margin: 0;
            font-weight: 400;
        }

        a {
            text-underline-offset: 25%;
            text-decoration-color: rgb(var(--fg) / .3);
            color: rgb(var(--fg) / .7);
            transition: color 200ms;
        }

        a:hover,
        a:focus-visible {
            color: rgb(var(--fg));
        }

        #links {
            list-style: none;
            padding: 0 0 4px 14px;
            border-left: 5px solid rgb(var(--fg) / .3);
        }

        /*
         * The rest of each URL, dimmed. Real text rather than ::after
         * content so it can be selected, searched, and indexed.
         */
        #links a span {
            color: rgb(var(--fg) / .3);
            transition: color 200ms;
        }

        #links a:hover span,
        #links a:focus-visible span {
            color: rgb(var(--fg));
        }
    </style>
