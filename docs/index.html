    <style>
        /*
         * Self-hosted so the page has no third-party origins on its critical
         * path. This is the Google Fonts "latin" subset of IBM Plex Sans
         * Regular, the only face the page uses. No unicode-range: the file is
         * preloaded unconditionally, so range-gating the download would save
         * nothing, and a glyph outside the subset falls back through the stack
         * below either way.
         */
        @font-face {
            font-family: "IBM Plex Sans";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("/fonts/ibm-plex-sans-latin-400.woff2") format("woff2");
        }

        :root {
            /* Channels only, so the alpha ladder below can vary one value. */
            --fg: 210 191 172;
            --bg: rgb(47, 47, 47);
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            background-color: var(--bg);
            color: rgb(var(--fg));
            font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
                "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14pt;
            line-height: 1.6;
        }

        /*
         * Auto margins center the block, but unlike `align-items: center` they
         * resolve to zero when free space is negative (Flexbox 8.1). On a short
         * viewport the content therefore sits at the start edge and scrolls,
         * instead of overflowing equally in both directions with the top half
         * unreachable.
         */
        main {
            margin: auto;
            width: 100%;
            max-width: 410px;
            min-width: 0;
            padding-block: 24px;
        }

        header {
            color: rgb(var(--fg) / .5);
        }

        header,
        section {
            padding: 0 10px;
        }

        h1 {
            font-size: 28pt;
            color: rgb(var(--fg) / .3);
            padding: 0px;
            margin: 0px;
            font-weight: 400;
        }

        a {
            text-decoration: underline;
            text-underline-offset: 25%;
            text-decoration-color: rgb(var(--fg) / .3);
            color: rgb(var(--fg) / .7);
            transition: 200ms;
        }

        a:hover {
            color: rgb(var(--fg));
        }

        #links {
            list-style: none;
            padding: 0;
            border-left: 5px solid rgb(var(--fg) / .3);
            padding-left: 14px;
            padding-bottom: 4px;
        }

        #links a:after {
            color: rgb(var(--fg) / .3);
            transition: 200ms;
        }

        #links a:hover::after {
            color: rgb(var(--fg));
        }

        #github:after {
            content: ".com/buth";
        }

        #bsky:after {
            content: ".app/profile/buth.dev";
        }

        #hachyderm:after {
            content: ".io/@buth";
        }
    </style>
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",

            "sameAs": [
                "https://github.com/buth",
                "https://bsky.app/profile/buth.dev",
                "https://hachyderm.io/@buth",
                "https://www.linkedin.com/in/ebuth/"
            ]
        }
    </script>
</head>

                    href="https://www.nytimes.com/">The New York Times</a>, and <a
                    href="https://www.linkedin.com/in/ebuth/">elsewhere</a>.</p>
        </header>
        <section>

                <li><a id="bsky" href="https://bsky.app/profile/buth.dev">bsky</a></li>
                <li><a id="hachyderm" href="https://hachyderm.io/@buth">hachyderm</a></li>
            </ul>
        </section>
    </main>
</body>
